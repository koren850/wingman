name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: Which system to run (default all). Windows also runs the packaging smoke job.
        type: choice
        options: [all, macos, linux, windows]
        default: all

# A new push to a pull request cancels the run in progress for it; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})${{ matrix.os == 'windows-latest' && ' (experimental)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # macOS is the supported platform. Linux runs the same checks and gates the build too (engine and file replay only; no live capture).
    # Windows may still fail while it is being ported (see docs). Remove this line once it is green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # While the repo is private, a push runs Linux only (macOS minutes cost 10x, Windows 2x). "Run workflow" by hand runs all three, or the one
        # picked in the "os" input; a public repo always runs all three.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.os != 'all') && format('["{0}"]', fromJSON('{"macos":"macos-latest","linux":"ubuntu-latest","windows":"windows-latest"}')[inputs.os]) || ((github.event.repository.private && github.event_name != 'workflow_dispatch') && '["ubuntu-latest"]' || '["macos-latest", "ubuntu-latest", "windows-latest"]')) }}
    env:
      # Skip the Electron download and the .app build: CI only needs the engine and the tests.
      WINGMAN_SKIP_APP: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # corepack must be on before setup-node so that `cache: pnpm` can find pnpm (the version comes from the packageManager field in package.json).
      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # setup-node switched Node, so enable corepack again for the Node 24 that the next steps use.
      - name: Enable pnpm for Node 24
        run: corepack enable

      # File replay and the end-to-end tests decode audio with ffmpeg.
      - name: Install ffmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS, if missing)
        if: matrix.os == 'macos-latest'
        working-directory: .
        run: command -v ffmpeg || brew install ffmpeg

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      # Lint and formatting run once, on the supported platform.
      - name: Lint
        if: matrix.os == 'macos-latest'
        run: pnpm lint

      - name: Check formatting
        if: matrix.os == 'macos-latest'
        run: pnpm format:check

      # CI has no private word list, so the "repo guard" test skips itself. That is expected.
      # Run it on your own machine with WINGMAN_DENYLIST set (see CONTRIBUTING.md).
      - name: Unit tests
        run: pnpm test:unit

      # The subprocess tests (the real call loop with scripted speech and a scripted model) take most of the run time: not on Windows yet.
      - name: End-to-end tests
        if: matrix.os != 'windows-latest'
        run: pnpm test:e2e

      # Offline evaluation (detector, bank matcher, guards). Fails when a metric drops below app/qa/eval-baseline.json.
      - name: Evaluation
        if: matrix.os != 'windows-latest'
        run: pnpm eval

      # Informational: prints line and branch coverage (Node's built-in coverage). No threshold, and a failure here never fails the build.
      - name: Test coverage (report only)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: pnpm test:coverage

  # The installer is a bash script for macOS: check that it still parses its flags and plans every step, without changing anything.
  install-script:
    name: install.sh smoke (macOS)
    if: ${{ (!github.event.repository.private || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.os == 'all' || inputs.os == 'macos') }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax
        run: bash -n install.sh

      # --check exits 1 when it finds a problem on this runner (for example a missing optional tool); only a crash or a usage error (2 or more) fails the job.
      - name: install.sh --check
        env:
          WINGMAN_DATA_DIR: ${{ runner.temp }}/wingman-data
        run: |
          set +e
          ./install.sh --check
          code=$?
          echo "exit code: $code"
          [ "$code" -le 1 ]

      - name: install.sh --dry-run
        env:
          WINGMAN_DATA_DIR: ${{ runner.temp }}/wingman-data
        run: ./install.sh --dry-run

  # Builds the Windows installer and checks it the way a user meets it: fuses, `Wingman.exe --wingman-smoke` (files, key store, a bundled tool),
  # silent per-user install, Start menu shortcut, tray start, silent uninstall (.github/scripts/windows-smoke.ps1). Costs Windows minutes, so it
  # runs only when started by hand (any "os" choice except macos and linux) or in a public repository.
  windows-package:
    name: Windows packaging smoke
    if: ${{ (!github.event.repository.private || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.os == 'all' || inputs.os == 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      WINGMAN_SKIP_APP: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Enable pnpm for Node 24
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the installer
        run: pnpm dist

      - name: Check the installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/Wingman-Setup-*-x64.exe | Select-Object -First 1
          ../.github/scripts/windows-smoke.ps1 -Unpacked dist/win-unpacked -Installer $installer.FullName
