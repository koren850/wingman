name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run in progress for it; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})${{ matrix.os != 'macos-latest' && ' (experimental)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # macOS is the supported platform and gates the build. Linux and Windows run the same checks but may fail for now:
    # the engine, tests and file replay are being ported (see docs). Remove this line once they are green.
    continue-on-error: ${{ matrix.os != 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      # Skip the Electron download and the .app build: CI only needs the engine and the tests.
      WINGMAN_SKIP_APP: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # corepack must be on before setup-node so that `cache: pnpm` can find pnpm (the version comes from the packageManager field in package.json).
      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # setup-node switched Node, so enable corepack again for the Node 24 that the next steps use.
      - name: Enable pnpm for Node 24
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      # Lint and formatting run once, on the supported platform.
      - name: Lint
        if: matrix.os == 'macos-latest'
        run: pnpm lint

      - name: Check formatting
        if: matrix.os == 'macos-latest'
        run: pnpm format:check

      # CI has no private word list, so the "repo guard" test skips itself. That is expected.
      # Run it on your own machine with WINGMAN_DENYLIST set (see CONTRIBUTING.md).
      - name: Unit tests
        run: pnpm test:unit

      # The subprocess tests (the real call loop with scripted speech and a scripted model) take most of the run time: macOS only.
      - name: End-to-end tests
        if: matrix.os == 'macos-latest'
        run: pnpm test:e2e

      # Offline evaluation (detector, bank matcher, guards). Fails when a metric drops below app/qa/eval-baseline.json.
      - name: Evaluation
        if: matrix.os == 'macos-latest'
        run: pnpm eval

      # Informational: prints line and branch coverage (Node's built-in coverage). No threshold, and a failure here never fails the build.
      - name: Test coverage (report only)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: pnpm test:coverage

  # The installer is a bash script for macOS: check that it still parses its flags and plans every step, without changing anything.
  install-script:
    name: install.sh smoke (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Syntax
        run: bash -n install.sh

      # --check exits 1 when it finds a problem on this runner (for example a missing optional tool); only a crash or a usage error (2 or more) fails the job.
      - name: install.sh --check
        env:
          WINGMAN_DATA_DIR: ${{ runner.temp }}/wingman-data
        run: |
          set +e
          ./install.sh --check
          code=$?
          echo "exit code: $code"
          [ "$code" -le 1 ]

      - name: install.sh --dry-run
        env:
          WINGMAN_DATA_DIR: ${{ runner.temp }}/wingman-data
        run: ./install.sh --dry-run
