name: Release

# A tag like v0.0.1 builds the macOS app (.dmg, Apple Silicon) and the Windows installer (.exe, x64), both unsigned for now, and attaches
# both to the release of that tag. The publish script creates the release first (with the notes); if there is none, a DRAFT is created
# and nothing is published until someone reviews it and clicks "Publish release".
# A public repository has free minutes for the macOS and Windows runners; a private one pays 10x and 2x.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Makes sure the release exists once, so the two build jobs below do not both try to create it.
  release:
    name: release for the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create a draft release if there is none
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Wingman $GITHUB_REF_NAME" \
              --notes "Unsigned builds. macOS (Apple Silicon, macOS 14.2 or newer): open the .dmg, drag Wingman to Applications, and confirm the first start. Windows 10 or 11 (64-bit): run the .exe; if SmartScreen shows 'Windows protected your PC', choose More info, then Run anyway. See the README."
          fi

  dmg:
    name: build the .dmg (macOS, arm64)
    needs: release
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write # upload the .dmg
    defaults:
      run:
        working-directory: app
    env:
      # Skip the dev launcher build in postinstall: the packaged app is built by `pnpm dist`.
      WINGMAN_SKIP_APP: "1"
      # Signing and notarizing are OFF. To switch them on later, set WINGMAN_SIGN=1 and add the secrets listed in app/electron-builder.cjs
      # (CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) to the repository and pass them here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Enable pnpm for Node 24
        run: corepack enable

      - name: Check that the tag matches the version
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match app/package.json version $version"; exit 1; }

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build the app
        run: pnpm dist

      - name: Check the fuses of the built app
        run: node scripts/set-fuses.cjs dist/mac-arm64/Wingman.app --check

      - name: Attach the .dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" --clobber dist/Wingman-*-arm64.dmg

  exe:
    name: build the installer (Windows, x64)
    needs: release
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write # upload the installer
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      # No Electron download in postinstall (electron-builder downloads the Windows files itself) and no dev launcher build.
      WINGMAN_SKIP_APP: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Signing is OFF. SmartScreen warns on the first start of an unsigned installer; the release notes say how to continue.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Enable pnpm for Node 24
        run: corepack enable

      - name: Check that the tag matches the version
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match app/package.json version $version"; exit 1; }

      - name: Install
        run: pnpm install --frozen-lockfile

      # The unit tests gate the release on macOS (the dmg job). Windows runs only the checks that are about Windows.
      - name: Type check
        run: pnpm typecheck

      - name: Build the installer
        run: pnpm dist

      - name: Check the installer (fuses, smoke, install, tray, uninstall)
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/Wingman-Setup-*-x64.exe | Select-Object -First 1
          ../.github/scripts/windows-smoke.ps1 -Unpacked dist/win-unpacked -Installer $installer.FullName

      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" --clobber dist/Wingman-Setup-*-x64.exe
