# Offline end-to-end test (src/e2e/scripted-call.test.ts): scripted STT + scripted AI, no network, no keys.
stt:
  provider: script
  fallback: []
llm:
  reflex:
    model: "scripted:bank"
    fallbacks: []
notes:
  model: "scripted:notes"
  everyMs: 10000
  minNewWords: 5
summary:
  model: "scripted:summary"
  minWords: 20 # the scripted call is short; the default 150 would skip it
facts:
  file: data/test/entities-fixture.json
privacy:
  requireConsentAck: false
system:
  caffeinate: false
frame:
  model: "scripted:frame"
  everyMs: 10000
  minNewWords: 8
tips:
  model: "scripted:tips"
  minGapMs: 10000
  afterAnswerMs: 2000
cards:
  focus: false # tests count every card; "important only" is tested on its own
