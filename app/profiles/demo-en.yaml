# English practice call: a pretend client plays from data/demo/demo-call.en.json (see demo.yaml for the Hebrew one).
# Offline and free: scripted speech-to-text, scripted AI, invented client data. Nothing leaves the Mac.
ui:
  language: en # English labels, matching the English call
stt:
  provider: script
  fallback: []
llm:
  reflex:
    model: "scripted:bank"
    fallbacks: []
notes:
  model: "scripted:notes"
  everyMs: 15000
  minNewWords: 5
facts:
  file: data/demo/entities.en.json
privacy:
  requireConsentAck: false
system:
  caffeinate: false
budget:
  idleStopMin: 0
summary:
  model: "scripted:summary" # practice stays offline and free
  minWords: 20
frame:
  model: "scripted:frame"
  everyMs: 10000
  minNewWords: 8
tips:
  model: "scripted:tips"
  minGapMs: 10000
  afterAnswerMs: 2000
