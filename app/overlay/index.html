<!doctype html>
<!-- Answer window page (Hebrew or English chrome, setting ui.language). Loaded by overlay/main.cjs, which tails the call files and sends rows over IPC (preload.cjs -> window.wingman).
     Shows the newest card as the hero, older ones as small rows. In the Focus layout (default) tips, call checklist, client and fact cards, AI notes and captured details wait behind a "More" strip; the Full layout shows them all at once. Plus tips, call checklist, captured phone/email/domain chips, a rewind sheet and the key legend.
     No network: CSP allows only local files. style-src is file: only: all CSS lives in overlay.css (no inline style block or style attributes), and scripts stay external-only. Text is always set with textContent / text nodes (never innerHTML), because card text comes from the call. -->
<html lang="he" dir="rtl" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src file:; script-src 'self'; img-src file:; base-uri 'none'; form-action 'none'"
    />
    <title>Wingman</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="wrap">
      <div id="top">
        <img src="../../brand/png/mark-night-512.png" alt="" /><span class="name">Wingman</span><span id="dot"></span><span id="state">Starting…</span
        ><span id="hdot" class="ok" role="img"></span><span id="hlabel"></span><span id="aipill"></span>
        <div id="ask"></div>
        <button id="fold" type="button" aria-pressed="false"><span aria-hidden="true"></span></button>
      </div>
      <div id="note" role="status" dir="auto"></div>
      <div id="health"></div>
      <div id="aibar" role="status"></div>
      <div id="frame" dir="rtl">
        <span class="fl" data-i18n="frame.label">Call:</span><span class="ft"></span><span id="chip"></span>
        <div id="cl"></div>
      </div>
      <div id="flow" dir="rtl">
        <span class="fk" data-i18n="flow.among">Talking among themselves</span><span class="fw"></span><span class="fx" dir="rtl"></span>
      </div>
      <div id="you" dir="rtl" role="alert"><span data-i18n="flow.you">👉 Addressing you</span><span class="yt" dir="rtl"></span></div>
      <div id="last" dir="rtl"><span class="who">Other side</span><span class="txt" dir="rtl"></span></div>
      <div id="lastme" dir="rtl"><span class="who">You</span><span class="txt" dir="rtl"></span></div>
      <div id="stage">
        <div id="main">
          <div id="hero"></div>
          <div id="watch">
            <div id="chips"></div>
            <div id="wlist"></div>
          </div>
          <div id="cards"></div>
          <button id="morebtn" type="button"></button>
          <div id="morebox"></div>
          <div id="tips"></div>
          <div id="capture"></div>
          <div id="rail"></div>
          <div id="notes">
            <div class="h" data-i18n="notes.title">AI notes</div>
            <ul id="notelist"></ul>
          </div>
        </div>
        <div id="empty">
          <img src="../../brand/png/mark-night-512.png" alt="" />
          <div id="emptyT">Starting the call…</div>
          <small id="emptyS"></small>
          <div id="idle"></div>
        </div>
        <div id="recap" role="dialog"></div>
        <div id="rewind">
          <div id="rnew"></div>
          <div id="rcontent"></div>
        </div>
      </div>
      <div id="keys"></div>
      <div id="live" class="sr" aria-live="polite" role="status"></div>
    </div>
    <script src="../shared/ask.js"></script>
    <script src="../dashboard/bidi.js"></script>
    <script src="strings.js"></script>
    <script src="text.js"></script>
    <script src="../shared/memview.js"></script>
    <script src="v2.js"></script>
    <script src="v2view.js"></script>
    <script src="app.js"></script>
  </body>
</html>
