- id: stall
  title: Check and come back
  triggers: []
  say: I want to check that properly and come back to you with an accurate answer.
  facts:
    - We do not guess
    - We check and come back
    - The question is noted
  alts:
    - I don't want to guess. Let me check and come back with a clear answer.
    - Let me verify that first, and I will get back to you.
- id: stall-price
  title: Price question
  triggers:
    - price
    - pricing
    - how much
    - cost
    - quote
    - budget
    - what does it cost
    - discount
    - rates
  say: The price depends on the plan and the details. I need the details first, and then I will send a clear quote.
  facts:
    - No number without details
    - Come back after checking
  alts:
    - It depends on the details. Let me check and come back to you with a proper figure.
- id: stall-timeline
  title: Time question
  triggers:
    - how long
    - how soon
    - when can
    - deadline
    - timeline
    - turnaround
    - by when
    - how fast
  say: It depends on the details. Let me check and I will come back with a realistic estimate.
  facts:
    - Depends on scope
    - Estimate after checking
    - No date on the call
  alts:
    - I would rather check than guess. I will come back with an estimate.
- id: stall-guarantee
  title: Promise question
  triggers:
    - guarantee
    - promise
    - sla
    - uptime
    - will you commit
    - can you commit
    - in writing
    - are you sure
  say: I don't want to commit before checking. I will come back with what we can commit to, in writing.
  facts:
    - No commitment on the call
    - We define it in writing
- id: empathy
  title: Acknowledge the problem
  triggers:
    - not working
    - broken
    - frustrated
    - this is a problem
    - again
    - keeps happening
    - i am stuck
    - i'm stuck
    - cannot use
    - can't use
  say: I understand, that is frustrating. Let me make sure I have the whole picture, and then we will work on it together.
  facts:
    - Acknowledge first
    - Then ask questions
    - Stay calm
- id: gather-info
  title: What I need to know
  triggers:
    - what happened
    - steps to reproduce
    - how do i reproduce
    - error message
    - what do you see
    - screenshot
    - when did it start
    - what changed
  say: Could you tell me what you did just before it happened, and what you see on the screen? A screenshot would help.
  facts:
    - What they clicked
    - The exact error text
    - When it started
- id: login
  title: Cannot log in
  triggers:
    - cannot log in
    - can't log in
    - login
    - log in
    - sign in
    - password
    - locked out
    - forgot password
    - reset password
    - account locked
  say: Let us start with a password reset from the sign-in page. If the email does not arrive, check the spam folder and tell me.
  facts:
    - Reset from the sign-in page
    - Check spam
    - Confirm the account email
- id: two-factor
  title: Two-step login
  triggers:
    - two factor
    - 2fa
    - mfa
    - verification code
    - authenticator
    - lost my phone
    - new phone
    - code does not arrive
  say: If you lost access to your second step, I can start an identity check so the account owner can reset it safely.
  facts:
    - Identity check first
    - Account owner resets it
    - Never skip the check
- id: slow
  title: Slow or freezing
  triggers:
    - slow
    - laggy
    - freezing
    - frozen
    - hangs
    - takes forever
    - loading
    - spinning
    - not loading
    - performance
  say: "Let us check a few simple things: the browser and its version, the connection, and whether it is slow for everyone or only for you."
  facts:
    - Browser and version
    - Connection
    - One person or everyone
- id: clear-cache
