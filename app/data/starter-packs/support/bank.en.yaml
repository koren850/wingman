# English text of the cards, shown when the other side speaks English (the cards in bank.yaml are Hebrew).
# A card without an entry here is not shown in English: the AI answers in English instead.
stall:
  say: I want to check that properly and come back to you with an accurate answer.
  facts:
    - We do not guess
    - We check and come back
    - The question is noted
  alts:
    - I don't want to guess. Let me check and come back with a clear answer.
    - Let me verify that first, and I will get back to you.
stall-price:
  say: The price depends on the plan and the details. I need the details first, and then I will send a clear quote.
  facts:
    - No number without details
    - Come back after checking
  alts:
    - It depends on the details. Let me check and come back to you with a proper figure.
stall-timeline:
  say: It depends on the details. Let me check and I will come back with a realistic estimate.
  facts:
    - Depends on scope
    - Estimate after checking
    - No date on the call
  alts:
    - I would rather check than guess. I will come back with an estimate.
stall-guarantee:
  say: I don't want to commit before checking. I will come back with what we can commit to, in writing.
  facts:
    - No commitment on the call
    - We define it in writing
empathy:
  say: I understand, that is frustrating. Let me make sure I have the whole picture, and then we will work on it together.
  facts:
    - Acknowledge first
    - Then ask questions
    - Stay calm
gather-info:
  say: Could you tell me what you did just before it happened, and what you see on the screen? A screenshot would help.
  facts:
    - What they clicked
    - The exact error text
    - When it started
login:
  say: Let us start with a password reset from the sign-in page. If the email does not arrive, check the spam folder and tell me.
  facts:
    - Reset from the sign-in page
    - Check spam
    - Confirm the account email
two-factor:
  say: If you lost access to your second step, I can start an identity check so the account owner can reset it safely.
  facts:
    - Identity check first
    - Account owner resets it
    - Never skip the check
slow:
  say: "Let us check a few simple things: the browser and its version, the connection, and whether it is slow for everyone or only for you."
  facts:
    - Browser and version
    - Connection
    - One person or everyone
clear-cache:
  say: Please try a private window, or another browser. If it works there, the cause is probably saved data in your usual browser.
  facts:
    - Private window
    - Another browser
    - Clear saved data after
known-issue:
  say: I will check our status page and our open issues right now. If it is a known issue, I will tell you where we are with it.
  facts:
    - Status page
    - Open issues
    - Tell them what is known
bug-report:
  say: Thank you for telling us. I will write it up with your steps and screenshots, so the product team can see it clearly.
  facts:
    - Write it up with steps
    - Add screenshots
    - Share the reference with the customer
data-loss:
  say: First, please do not make more changes. Let me check whether we can restore it, and I will tell you what is possible.
  facts:
    - Stop making changes
    - Check restore options
    - Tell what is possible, not more
billing:
  say: I can see how to help with that, but billing questions go through our billing team so they are exact. I will pass it on with your details.
  facts:
    - Billing team handles it
    - Pass details on
    - No promises about refunds
permissions:
  say: That is usually a permission setting. An admin of your account can change the role. Do you know who the admin is?
  facts:
    - Ask who the admin is
    - Check the role
    - Invite from the admin page
integration-issue:
  say: Let us reconnect the integration first. If it still fails, I need the error message and the time it last worked.
  facts:
    - Reconnect first
    - Collect the error
    - When it last worked
how-to:
  say: Sure. Where are you in the app right now? I will walk you through it one step at a time.
  facts:
    - Ask where they are
    - One step at a time
    - Send the help article after
escalate:
  say: I hear you. I will pass this to a senior colleague with all the details, so you do not have to repeat yourself.
  facts:
    - Pass on with details
    - No need to repeat
    - Tell them who will follow up
follow-up:
  say: I am glad it works. I will send you a short summary of what we did, so you have it if it comes back.
  facts:
    - Summary by email
    - Ask if anything is left
    - Say how to reach us again
