<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Wingman</title>
<style>
  :root { --bg:#111418; --card:#1b2028; --text:#f2f4f7; --muted:#8a94a6; --bank:#2f9e6b; --ai:#5b8def; --stall:#c9a227; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system, "SF Hebrew", "Arial Hebrew", sans-serif; -webkit-app-region:drag; }
  #wrap { padding:16px; display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--card); border-radius:14px; padding:16px 18px; border-inline-start:6px solid var(--ai); transition:opacity .2s; }
  .card.bank { border-color:var(--bank); } .card.stall { border-color:var(--stall); } .card.info { border-color:#8a94a6; }
  .card.old { opacity:.45; } .card.dim { opacity:.55; }
  #health { display:flex; flex-direction:column; gap:8px; }
  .hb { border-radius:10px; padding:10px 14px; font-size:22px; font-weight:700; color:#fff; background:#b3261e; }
  .hb.amber { background:#a8620a; } .hb.info { background:#3a4252; font-weight:500; font-size:18px; }
  #paused { display:none; background:#3a4252; border-radius:10px; padding:8px 14px; font-size:18px; }
  .q { color:var(--muted); font-size:15px; margin-bottom:6px; }
  .say { font-size:var(--say-pt, 30px); line-height:1.3; font-weight:650; }
  ul { margin:10px 0 0; padding-inline-start:22px; font-size:20px; color:#d0d6e0; }
  /* Cards are Hebrew: force RTL (no "plaintext"), so a line starting with "DNS" still reads right-to-left. */
  .badge { font-size:13px; color:var(--muted); margin-top:8px; direction:ltr; text-align:left; }
  #empty { color:var(--muted); font-size:18px; padding:24px; text-align:center; }
</style>
</head>
<body>
<div id="wrap"><div id="health"></div><div id="paused">⏸ מושהה (Ctrl+Opt+P)</div><div id="empty">Wingman מקשיב… הכרטיסים יופיעו כאן</div><div id="cards" style="display:flex;flex-direction:column;gap:12px"></div></div>
<script>
  const wrap = document.getElementById("wrap");
  const cardsBox = document.getElementById("cards");
  const healthBox = document.getElementById("health");
  const cards = new Map(); // id -> element
  const bars = new Map();  // health id -> element
  let MAX = 4;
  let paused = false;
  function clearCards() { for (const el of cards.values()) el.remove(); cards.clear(); }
  function renderHealth(c) {
    if (c.clear) { bars.get(c.id)?.remove(); bars.delete(c.id); return; }
    let el = bars.get(c.id);
    if (!el) { el = document.createElement("div"); bars.set(c.id, el); healthBox.append(el); }
    el.className = `hb ${c.level || "red"}`; el.dir = "rtl"; el.textContent = c.say;
  }
  function render(c) {
    if (c.health) { renderHealth(c); return; }
    if (c.withdraw) { cards.get(c.id)?.remove(); cards.delete(c.id); return; }
    if (paused) return;
    document.getElementById("empty")?.remove();
    let el = cards.get(c.id);
    if (!el) {
      el = document.createElement("div");
      cards.set(c.id, el);
      cardsBox.prepend(el);
      for (const other of cards.values()) if (other !== el) other.classList.add("old");
      while (cards.size > MAX) { const [k, v] = cards.entries().next().value; v.remove(); cards.delete(k); }
    }
    el.className = `card ${c.badge}${c.dim ? " dim" : ""}`;
    el.replaceChildren();
    const q = document.createElement("div"); q.className = "q"; q.dir = "rtl"; q.textContent = c.question; el.append(q);
    const s = document.createElement("div"); s.className = "say"; s.dir = "rtl"; s.textContent = c.say; el.append(s);
    if (c.facts?.length) {
      const ul = document.createElement("ul");
      for (const f of c.facts) { const li = document.createElement("li"); li.dir = "rtl"; li.textContent = f; ul.append(li); }
      el.append(ul);
    }
    const b = document.createElement("div"); b.className = "badge";
    b.textContent = { bank: "bank", ai: "AI · not verified", stall: "stall", info: "reminder" }[c.badge] + (c.dim ? " · low confidence / you were already talking" : "");
    el.append(b);
  }
  window.wingman.onConfig((c) => { MAX = c.maxCards; document.documentElement.style.setProperty('--say-pt', c.fontPt + 'px'); });
  window.wingman.onCard(render);
  window.wingman.onReset(() => { clearCards(); for (const el of bars.values()) el.remove(); bars.clear(); });
  window.wingman.onClear(clearCards);
  window.wingman.onPause(() => { paused = !paused; document.getElementById("paused").style.display = paused ? "block" : "none"; if (paused) clearCards(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") clearCards(); });
</script>
</body>
</html>
