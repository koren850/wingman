<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Wingman</title>
<style>
  :root { --bg:#111418; --card:#1b2028; --text:#f2f4f7; --muted:#8a94a6; --bank:#2f9e6b; --ai:#5b8def; --stall:#c9a227; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system, "SF Hebrew", "Arial Hebrew", sans-serif; -webkit-app-region:drag; }
  /* Full-height column: answers take the free space (oldest cut off at the bottom), the side rail and notes stay pinned below. */
  #wrap { padding:16px; display:flex; flex-direction:column; gap:12px; height:100vh; box-sizing:border-box; overflow:hidden; }
  #cards { flex:1 1 auto; min-height:120px; overflow:hidden; }
  #rail, #notes { flex:0 0 auto; max-height:38vh; overflow:hidden; }
  .card { background:var(--card); border-radius:14px; padding:16px 18px; border-inline-start:6px solid var(--ai); transition:opacity .2s; }
  .card.bank { border-color:var(--bank); } .card.stall { border-color:var(--stall); } .card.info { border-color:#8a94a6; }
  .card.old { opacity:.45; } .card.dim { opacity:.55; }
  #health { display:flex; flex-direction:column; gap:8px; }
  .hb { border-radius:10px; padding:10px 14px; font-size:22px; font-weight:700; color:#fff; background:#b3261e; }
  .hb.amber { background:#a8620a; } .hb.info { background:#3a4252; font-weight:500; font-size:18px; }
  #paused { display:none; background:#3a4252; border-radius:10px; padding:8px 14px; font-size:18px; }
  .q { color:var(--muted); font-size:15px; margin-bottom:6px; }
  .say { font-size:var(--say-pt, 30px); line-height:1.3; font-weight:650; }
  ul { margin:10px 0 0; padding-inline-start:22px; font-size:20px; color:#d0d6e0; }
  /* Cards are Hebrew: force RTL (no "plaintext"), so a line starting with "DNS" still reads right-to-left. */
  .badge { font-size:13px; color:var(--muted); margin-top:8px; direction:ltr; text-align:left; }
  #empty { color:var(--muted); font-size:18px; padding:24px; text-align:center; }
  /* Rewind panel ("what did they say?") and capture box. */
  #rewind { display:none; background:#1f2733; border:2px solid var(--ai); border-radius:14px; padding:12px 16px; max-height:340px; overflow-y:auto; }
  #rewind .h { color:var(--muted); font-size:14px; margin-bottom:6px; }
  #rewind .l { font-size:22px; line-height:1.35; margin:4px 0; }
  #rewind .l.me { color:var(--muted); font-size:17px; }
  #capture { display:none; flex-wrap:wrap; gap:8px; }
  .cap { -webkit-app-region:no-drag; cursor:pointer; background:#26303d; border-radius:10px; padding:6px 12px; font-size:20px; direction:ltr; unicode-bidi:isolate; }
  .cap .k { color:var(--muted); font-size:13px; margin-inline-end:8px; unicode-bidi:isolate; }
  .cap.copied { background:#2f9e6b; }
  /* Side rail: fact cards, reminders, live notes (below the answers, smaller). */
  #rail { display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .side { background:#1a1f27; border-radius:12px; padding:10px 14px; border-inline-start:4px solid #8b6fd6; }
  .side.reminder { border-color:var(--stall); } .side.warn { border-color:#d9534f; } .side.info { border-color:#8a94a6; }
  .side .t { font-size:20px; font-weight:650; } .side ul { font-size:17px; margin-top:4px; }
  #notes { display:none; background:#161a20; border-radius:12px; padding:8px 14px; }
  #notes .h { color:var(--muted); font-size:13px; } #notes li { font-size:17px; color:#c9d1dc; margin:3px 0; }
</style>
</head>
<body>
<div id="wrap"><div id="health"></div><div id="paused">⏸ מושהה (Ctrl+Opt+P)</div><div id="rewind"></div><div id="capture"></div><div id="empty">Wingman מקשיב… הכרטיסים יופיעו כאן</div><div id="cards" style="display:flex;flex-direction:column;gap:12px"></div><div id="rail"></div><div id="notes"><div class="h">הערות מהשיחה</div><ul id="notelist"></ul></div></div>
<script>
  const wrap = document.getElementById("wrap");
  const cardsBox = document.getElementById("cards");
  const healthBox = document.getElementById("health");
  const cards = new Map(); // id -> element
  const bars = new Map();  // health id -> element
  let MAX = 4;
  let paused = false;
  function clearCards() { for (const el of cards.values()) el.remove(); cards.clear(); }
  function renderHealth(c) {
    if (c.clear) { bars.get(c.id)?.remove(); bars.delete(c.id); return; }
    let el = bars.get(c.id);
    if (!el) { el = document.createElement("div"); bars.set(c.id, el); healthBox.append(el); }
    el.className = `hb ${c.level || "red"}`; el.dir = "rtl"; el.textContent = c.say;
  }
  const rail = document.getElementById("rail"), notesBox = document.getElementById("notes"), noteList = document.getElementById("notelist");
  const sides = new Map();
  function renderSide(c) {
    if (c.badge === "note") {
      const li = document.createElement("li"); li.dir = "rtl"; li.textContent = c.say; noteList.append(li);
      while (noteList.children.length > 8) noteList.firstElementChild.remove();
      notesBox.style.display = "block"; return;
    }
    let el = sides.get(c.id);
    if (!el) { el = document.createElement("div"); sides.set(c.id, el); rail.prepend(el); }
    el.className = `side ${c.badge}${c.warn ? " warn" : ""}`; el.replaceChildren();
    const t = document.createElement("div"); t.className = "t"; t.dir = "rtl"; t.textContent = c.say; el.append(t);
    if (c.facts?.length) { const ul = document.createElement("ul"); for (const f of c.facts) { const li = document.createElement("li"); li.dir = "rtl"; li.textContent = f; ul.append(li); } el.append(ul); }
    while (sides.size > 3) { const [k, v] = sides.entries().next().value; v.remove(); sides.delete(k); }
  }
  function render(c) {
    if (c.health) { renderHealth(c); return; }
    if (c.turnId === "side") { renderSide(c); return; }   // facts/notes/reminders are kept even while paused
    if (c.withdraw) { cards.get(c.id)?.remove(); cards.delete(c.id); return; }
    if (paused) return;
    document.getElementById("empty")?.remove();
    let el = cards.get(c.id);
    if (!el) {
      el = document.createElement("div");
      cards.set(c.id, el);
      cardsBox.prepend(el);
      for (const other of cards.values()) if (other !== el) other.classList.add("old");
      while (cards.size > MAX) { const [k, v] = cards.entries().next().value; v.remove(); cards.delete(k); }
    }
    el.className = `card ${c.badge}${c.dim ? " dim" : ""}`;
    el.replaceChildren();
    const q = document.createElement("div"); q.className = "q"; q.dir = "rtl"; q.textContent = c.question; el.append(q);
    const s = document.createElement("div"); s.className = "say"; s.dir = "rtl"; s.textContent = c.say; el.append(s);
    if (c.facts?.length) {
      const ul = document.createElement("ul");
      for (const f of c.facts) { const li = document.createElement("li"); li.dir = "rtl"; li.textContent = f; ul.append(li); }
      el.append(ul);
    }
    const b = document.createElement("div"); b.className = "badge";
    b.textContent = { bank: "bank", ai: "AI · not verified", stall: "stall", info: "reminder" }[c.badge] + (c.dim ? " · low confidence / you were already talking" : "");
    el.append(b);
  }
  // Rewind: keep recent transcript lines; the hotkey shows the last N seconds (auto-hides after 20 s).
  const lines = []; let REWIND_S = 30, rewindTimer;
  const rewindBox = document.getElementById("rewind"), capBox = document.getElementById("capture");
  function showRewind() {
    if (rewindBox.style.display === "block") { rewindBox.style.display = "none"; return; }
    const since = Date.now() - REWIND_S * 1000;
    let recent = lines.filter((l) => l.t >= since);
    if (!recent.length) recent = lines.slice(-4);   // quiet for a while: show the last few lines anyway
    rewindBox.replaceChildren();
    const h = document.createElement("div"); h.className = "h"; h.textContent = lines.some((l) => l.t >= since) ? `${REWIND_S} השניות האחרונות` : "השורות האחרונות"; rewindBox.append(h);
    if (!recent.length) { const e = document.createElement("div"); e.className = "l"; e.textContent = "אין טקסט מהשניות האחרונות"; rewindBox.append(e); }
    for (const l of recent) {
      const d = document.createElement("div"); d.className = `l ${l.ch}`; d.dir = "rtl";
      d.textContent = (l.ch === "me" ? "אני: " : "לקוח: ") + l.text; rewindBox.append(d);
    }
    rewindBox.style.display = "block"; rewindBox.scrollTop = rewindBox.scrollHeight;
    clearTimeout(rewindTimer); rewindTimer = setTimeout(() => { rewindBox.style.display = "none"; }, 20000);
  }
  window.wingman.onLine((l) => { lines.push(l); while (lines.length > 400) lines.shift(); });
  window.wingman.onRewind(showRewind);
  const caps = new Map();
  window.wingman.onCapture((c) => {
    if (caps.has(c.value)) return;
    const el = document.createElement("div"); el.className = "cap";
    const k = document.createElement("span"); k.className = "k"; k.textContent = { phone: "טלפון", email: "מייל", domain: "דומיין" }[c.kind] || c.kind;
    const v = document.createElement("span"); v.textContent = c.value;
    el.append(k, v); el.addEventListener("click", () => window.wingman.copy(c.value));
    caps.set(c.value, el); capBox.prepend(el); capBox.style.display = "flex";
    while (caps.size > 8) { const [key, node] = caps.entries().next().value; node.remove(); caps.delete(key); }
  });
  window.wingman.onCopied((t) => { const el = caps.get(t); if (el) { el.classList.add("copied"); setTimeout(() => el.classList.remove("copied"), 1200); } });
  window.wingman.onConfig((c) => { REWIND_S = c.rewindSeconds || 30; MAX = c.maxCards; document.documentElement.style.setProperty('--say-pt', c.fontPt + 'px'); });
  window.wingman.onCard(render);
  window.wingman.onReset(() => { clearCards(); for (const v of sides.values()) v.remove(); sides.clear(); noteList.replaceChildren(); notesBox.style.display = "none"; lines.length = 0; for (const n of caps.values()) n.remove(); caps.clear(); capBox.style.display = "none"; rewindBox.style.display = "none"; for (const el of bars.values()) el.remove(); bars.clear(); });
  window.wingman.onClear(clearCards);
  window.wingman.onPause(() => { paused = !paused; document.getElementById("paused").style.display = paused ? "block" : "none"; if (paused) clearCards(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") clearCards(); });
</script>
</body>
</html>
